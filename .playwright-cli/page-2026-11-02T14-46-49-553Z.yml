          - strong [ref=f13e1329]: Digital Asset Market Clarity Act of 2025 or the CLARITY Act of 2025
        - paragraph [ref=f13e1330]: This bill establishes a regulatory framework for digital commodities, defined by the bill as digital assets that rely upon a blockchain for their value.
        - paragraph [ref=f13e1331]: The Commodity Futures Trading Commission must generally regulate digital commodities transactions, including digital commodity exchanges, brokers, and dealers. To qualify for trade on an exchange (1) a digital commodityâ€™s blockchain must be mature, or on a blockchain system that has achieved decentralized control as defined by the bill; or (2) the issuer of the digital commodity must file certain reports. The bill establishes requirements for trade monitoring, recordkeeping, and the commingling of customer assets.
        - paragraph [ref=f13e1332]: The bill exempts digital commodities on mature blockchains (and digital commodities on blockchains expected to mature within certain timeframes) from Securities and Exchange Commission (SEC) registration requirements if annual sales fall under a certain amount and other requirements are met. The bill provides the SEC with jurisdiction over digital commodity activities and transactions engaged in by certain brokers and dealers on alternative trading systems and by national securities exchanges.
        - paragraph [ref=f13e1333]: Digital commodity exchanges, brokers, and dealers are subject to the Bank Secrecy Act for anti-money laundering and related purposes.
        - paragraph [ref=f13e1334]: The bill also sets forth requirements for alternative trading systems, previously issued digital commodities, and provisional registration until the bill is implemented.
        - paragraph [ref=f13e1335]:
          - text: For more information on this bill, see
